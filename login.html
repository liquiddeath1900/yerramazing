<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Login — YERRAMAZING</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --purple:#534AB7;--purple-dark:#3C3489;--purple-light:#EEEDFE;
  --bg:#fafafa;--surface:#fff;
  --text:#0f0f0f;--text-secondary:#555;--text-muted:#999;
  --border:rgba(0,0,0,.08);
  --card-bg:rgba(255,255,255,.7);--card-blur:16px;
  --shadow:0 1px 3px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
  --radius:20px;
  --mesh-1:#e8e4ff;--mesh-2:#d4f5e4;--mesh-3:#fce4ec;--mesh-4:#e3f2fd;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#0a0a0f;--surface:#18182a;
    --text:#f0f0f5;--text-secondary:rgba(255,255,255,.6);--text-muted:rgba(255,255,255,.35);
    --border:rgba(255,255,255,.08);
    --card-bg:rgba(255,255,255,.04);--card-blur:20px;
    --shadow:0 1px 3px rgba(0,0,0,.2),0 8px 24px rgba(0,0,0,.4);
    --mesh-1:rgba(83,74,183,.15);--mesh-2:rgba(67,160,71,.1);--mesh-3:rgba(233,30,99,.08);--mesh-4:rgba(33,150,243,.1);
  }
}
html{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text)}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;overflow:hidden}

.mesh-bg{position:fixed;inset:0;z-index:0;overflow:hidden}
.mesh-blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.6;animation:drift 20s ease-in-out infinite alternate}
.mesh-blob:nth-child(1){width:400px;height:400px;background:var(--mesh-1);top:-100px;left:-100px}
.mesh-blob:nth-child(2){width:350px;height:350px;background:var(--mesh-2);top:50%;right:-80px;animation-delay:-5s}
.mesh-blob:nth-child(3){width:300px;height:300px;background:var(--mesh-3);bottom:-60px;left:30%;animation-delay:-10s}
.mesh-blob:nth-child(4){width:250px;height:250px;background:var(--mesh-4);top:20%;left:50%;animation-delay:-15s}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,-20px) scale(1.1)}100%{transform:translate(-20px,30px) scale(.95)}}
@media(max-width:768px){.mesh-blob{filter:blur(40px);opacity:.45}.mesh-blob:nth-child(1){width:300px;height:300px}.mesh-blob:nth-child(2){width:260px;height:260px}.mesh-blob:nth-child(3){width:220px;height:220px}.mesh-blob:nth-child(4){width:180px;height:180px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.login-card{
  position:relative;z-index:1;
  background:var(--card-bg);backdrop-filter:blur(var(--card-blur));-webkit-backdrop-filter:blur(var(--card-blur));
  border:1px solid var(--border);border-radius:var(--radius);
  padding:48px 36px;max-width:400px;width:100%;
  box-shadow:var(--shadow);text-align:center;
}
.brand{font-size:28px;font-weight:900;letter-spacing:-.5px;margin-bottom:4px}
.brand span{background:linear-gradient(135deg,var(--purple),#7c4dff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.subtitle{font-size:13px;color:var(--text-muted);margin-bottom:28px}

.google-btn{
  width:100%;padding:14px;min-height:44px;
  background:var(--surface);color:var(--text);
  border:1px solid var(--border);border-radius:12px;
  font-size:16px;font-weight:600;font-family:inherit;
  cursor:pointer;transition:all .2s;
  display:flex;align-items:center;justify-content:center;gap:10px;
}
.google-btn:hover{border-color:var(--purple);background:var(--purple-light)}
@media(prefers-color-scheme:dark){.google-btn:hover{background:rgba(83,74,183,.15)}}
.google-btn svg{width:20px;height:20px;flex-shrink:0}

.divider{display:flex;align-items:center;gap:12px;margin:24px 0;color:var(--text-muted);font-size:12px;font-weight:500}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}

.label{font-size:12px;font-weight:600;color:var(--text-secondary);text-align:left;display:block;margin-bottom:6px}
.email-input{
  width:100%;padding:14px 16px;
  border:1px solid var(--border);border-radius:12px;
  font-size:16px;font-family:inherit;
  background:var(--surface);color:var(--text);
  outline:none;transition:border-color .2s;
}
.email-input:focus{border-color:var(--purple)}
.submit-btn{
  width:100%;padding:14px;margin-top:12px;min-height:44px;
  background:var(--purple);color:#fff;
  border:none;border-radius:12px;
  font-size:16px;font-weight:600;font-family:inherit;
  cursor:pointer;transition:background .2s,transform .1s;
}
.submit-btn:hover{background:var(--purple-dark)}
.submit-btn:active{transform:scale(.98)}
.submit-btn:disabled{opacity:.6;cursor:not-allowed}
.msg{font-size:13px;margin-top:16px;min-height:20px}
.msg.success{color:#43A047}
.msg.error{color:#d32f2f}
.back-link{
  display:inline-block;margin-top:24px;
  font-size:13px;color:var(--text-muted);text-decoration:none;
  transition:color .2s;
}
.back-link:hover{color:var(--purple)}
.denied-msg{
  background:rgba(211,47,47,.08);border:1px solid rgba(211,47,47,.2);
  border-radius:12px;padding:12px;margin-bottom:20px;
  font-size:13px;color:#d32f2f;
}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
</head>
<body>

<div class="mesh-bg" aria-hidden="true">
  <div class="mesh-blob"></div>
  <div class="mesh-blob"></div>
  <div class="mesh-blob"></div>
  <div class="mesh-blob"></div>
</div>

<div class="login-card">
  <div class="brand"><span>YERR</span>AMAZING</div>
  <div class="subtitle">Team access only</div>

  <div id="denied-box" class="denied-msg" style="display:none">
    This email is not authorized. Contact the team for access.
  </div>

  <!-- Google Sign In -->
  <button class="google-btn" id="google-btn">
    <svg viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
    Continue with Google
  </button>

  <div class="divider">or</div>

  <!-- Magic Link -->
  <label class="label" for="email">Email address</label>
  <input class="email-input" id="email" type="email" placeholder="your@email.com" autocomplete="email">
  <button class="submit-btn" id="submit-btn">Send Magic Link</button>
  <div class="msg" id="msg"></div>

  <a href="index.html" class="back-link">&larr; Back to homepage</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/supabase-sync.js"></script>
<script>
(async function() {
  // Where to send the user after sign-in. Read + sanitize ONCE, up front (before any
  // Supabase call cleans the URL). Only same-site relative paths allowed — no open redirect.
  const DEST = (function(){
    var r = new URLSearchParams(window.location.search).get('redirect') || '';
    if (!r) return 'hub.html';
    if (/^[a-z][a-z0-9+.-]*:/i.test(r) || r.indexOf('//') === 0 || r.indexOf('\\') === 0) return 'hub.html';
    return r.replace(/^\/+/, '');
  })();

  // Show denied message if redirected with error
  if (new URLSearchParams(window.location.search).get('error') === 'denied') {
    document.getElementById('denied-box').style.display = 'block';
  }

  // Check if already logged in
  const session = await getSession();
  if (session && session.user) {
    window.location.replace(DEST);
    return;
  }

  // Handle auth callback (magic link or OAuth redirect)
  const sb = getSupabase();
  sb.auth.onAuthStateChange((event, session) => {
    if (event === 'SIGNED_IN' && session) {
      window.location.replace(DEST);
    }
  });

  // Google sign in
  document.getElementById('google-btn').addEventListener('click', async () => {
    const { error } = await signInWithGoogle(DEST);
    if (error) {
      const msg = document.getElementById('msg');
      msg.className = 'msg error';
      msg.textContent = error.message || 'Google sign-in failed';
    }
  });

  // Magic link submit
  const btn = document.getElementById('submit-btn');
  const emailInput = document.getElementById('email');
  const msg = document.getElementById('msg');

  async function handleSubmit() {
    const email = emailInput.value.trim();
    if (!email) return;

    btn.disabled = true;
    btn.textContent = 'Sending...';
    msg.className = 'msg';
    msg.textContent = '';

    const { error } = await signInWithEmail(email, DEST);

    if (error) {
      msg.className = 'msg error';
      msg.textContent = error.message || 'Error sending link';
    } else {
      msg.className = 'msg success';
      msg.textContent = 'Check your email for the magic link!';
    }
    btn.disabled = false;
    btn.textContent = 'Send Magic Link';
  }

  btn.addEventListener('click', handleSubmit);
  emailInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') handleSubmit();
  });
})();
</script>
</body>
</html>
