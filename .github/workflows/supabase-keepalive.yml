name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 8 */3 * *'  # Every 3 days at 8am UTC (well under the 7-day pause window)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase auth health
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            "https://lpzijtmbdowcshomyenk.supabase.co/auth/v1/health")
          echo "Supabase /auth/v1/health responded: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::error::Supabase unhealthy (HTTP $STATUS) — project may be paused"
            exit 1
          fi
